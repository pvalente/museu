# Use on Lightsail: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  wordpress:
    ports: !reset []
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [wordpress]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
